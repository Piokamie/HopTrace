[project]
name = "hoptrace"
version = "0.1.0"
description = "Deterministic multi-hop retrieval engine with a measurement harness, exposed over MCP"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Piotr Kamieniecki", email = "piokamie@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]

[project.optional-dependencies]
ner = [
    "spacy>=3.8.15",
]
eval = [
    "numpy>=2.2.6",
]

[project.scripts]
hoptrace = "hoptrace.cli:main"

[build-system]
requires = ["uv_build>=0.8.24,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The typographic apostrophe appears intentionally (the normalizer and
# extractor must handle it in real text); × and − appear in formulas in
# docstrings.
allowed-confusables = ["’", "‘", "“", "”", "×", "−"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "spacy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
